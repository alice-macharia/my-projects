<h1>Simple Pancake Recipe</h1>

<ul>
<li>Flour</li>
<li>Milk</li>
<li>Eggs</li>
<li>Sugar</li>
</ul>

<ol type="I">
<li>Mix flour, milk, sugar and eggs</li>
<li>Heat pan over medium heat</li>
<li>Pour the mixture into the pan</li>
<li>Cook until golden brown</li>
</ol>
