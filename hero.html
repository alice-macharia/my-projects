<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gradient Hero Section</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .hero {
      background-image: linear-gradient(to right, #ff7e5f, #feb47b, #86a8e7);
      color: white;
      padding: 100px 20px;
      text-align: center;
    }
    .hero a.btn {
      display: inline-block;
      background-color: hsl(220, 80%, 45%);
      color: white;
      padding: 14px 28px;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .hero a.btn:hover {
      background-color: hsl(220, 80%, 30%);
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Learn to Code This Summer</h1>
    <p>Join our bootcamp and build real projects.</p>
    <a href="#" class="btn">Enroll Now</a>
  </section>
</body>
</html>
