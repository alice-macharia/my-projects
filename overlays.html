<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transparent Overlay Card</title>
  <style>
    .card {
      background-image: url('https://picsum.photos/1200/600');
      background-size: cover;
      background-position: center;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }
    .overlay {
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 20px 40px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="overlay">
      <h1>Explore the Outdoors</h1>
    </div>
  </div>
</body>
</html>
