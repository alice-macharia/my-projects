<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3: Styled Navigation Links</title>
  <style>
    nav {
      display: flex;
      gap: 24px;
      padding: 16px;
      background-color: #f4f4f4;
    }

    /* Remove default underline */
    nav a {
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
    }

    /* LoVe/HAte order: Link, Visited, Hover, Active */
    nav a:link {
      color: #666666;
    }

    nav a:visited {
      color: #4b2a7b;
    }

    nav a:hover {
      color: #e65100;
      text-decoration: underline;
    }

    nav a:active {
      color: #b71c1c;
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#gallery">Gallery</a>
    <a href="#contact">Contact</a>
  </nav>
</body>
</html>
